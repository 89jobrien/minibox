checks:
  - id: MOA-029
    path: README.md
    contains:
      - "workspace library tests only"
      - "conformance and property tests remain separate suites"
    excludes:
      - "unit + conformance + property tests"
  - id: MOA-029-xtask-reference
    path: docs/core/XTASK_CLI.mbx.md
    contains:
      - "Workspace `--lib` tests plus the `minibox-testsuite` zero-test guard"
      - "separate from conformance/property suites"
    excludes:
      - "Unit + conformance tests, any platform"
  - id: MOA-030
    path: DEVELOPMENT.md
    contains:
      - "Protocol E2E and unit suites run on any platform without root."
      - "Native integration, sandbox, and full daemon/CLI system suites require Linux, root"
  - id: MOA-031
    path: TESTING.md
    contains:
      - "`context-snapshot.yml`"
      - "rather than a hard-coded workflow count"
    excludes:
      - "Fourteen workflows"
  - id: MOA-030-031-infrastructure
    path: docs/core/TEST_INFRASTRUCTURE.mbx.md
    contains:
      - "| Protocol E2E"
      - "| Full-stack daemon+CLI system"
      - "`context-snapshot.yml`"
      - "rather than a hard-coded count"
    excludes:
      - "14 workflows in `.github/workflows/`"
      - "| E2E daemon+CLI"
  - id: MOA-032-pointer
    path: docs/FEATURE_MATRIX.md
    contains:
      - "docs/core/FEATURE_MATRIX.mbx.md"
      - "supports both DNS configuration and port forwarding"
    excludes:
      - "| Port forwarding"
      - "| DNS"
  - id: MOA-032-canonical
    path: docs/core/FEATURE_MATRIX.mbx.md
    contains:
      - "| `dns` | No | No | No | Yes | No | Blocked | No |"
      - "| `port_forwarding` | No | No | No | Yes | No | Blocked | No |"
  - id: MOA-035
    path: docs/plans/2026-08-25-xtask-info-context-enhancements.md
    contains:
      - "Superseded by V3"
      - "Do not implement or restore the v2 schema"
  - id: MOA-036
    path: docs/designs/2026-08-26-daemon-native-verified-execution-design.md
    contains:
      - "canonical `minibox-domain` crate"
      - "`crates/minibox-domain/src/execution_manifest.rs`"
      - "`crates/minibox-domain/src/execution_policy.rs`"
    excludes:
      - "`crates/minibox-core/src/domain/execution_manifest.rs`"
      - "`crates/minibox-core/src/domain/execution_policy.rs`"

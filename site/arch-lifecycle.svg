<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" fill="none"><style>text{font-family:"SF Mono","JetBrains Mono","Fira Code",monospace}.label{fill:#dfe1e8;font-size:11px;font-weight:600}.desc{fill:#7a7f94;font-size:9px}.title{fill:#dfe1e8;font-size:13px;font-weight:700}.phase{fill:#14171f;stroke:#5b8def;stroke-width:1.5;rx:6}.child{fill:#0f1a14;stroke:#34d399;stroke-width:1.4;rx:5}.security{fill:#1a1220;stroke:#a78bfa;stroke-width:1.4;rx:5}.arrow{stroke:#34d399;stroke-width:1.3;fill:none;marker-end:url(#a)}.host{fill:#5b8def;font-size:9px;font-weight:700;letter-spacing:.5px}.work{fill:#34d399;font-size:9px;font-weight:700;letter-spacing:.5px}.boundary{stroke:#2a3040;stroke-width:1;stroke-dasharray:6 4}</style><defs><marker id="a" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#34d399"/></marker></defs><text class="title" x="380" y="22" text-anchor="middle">Native Linux container lifecycle and isolation</text><text class="host" x="20" y="48">DAEMON / HOST PREPARATION</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" fill="none">
  <style>
    text { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace; }
    .label { fill: #dfe1e8; font-size: 11px; font-weight: 600; }
    .desc { fill: #7a7f94; font-size: 9px; }
    .state { fill: #14171f; stroke-width: 1.5; rx: 6; }
    .s-created { stroke: #7a7f94; }
    .s-running { stroke: #34d399; }
    .s-paused { stroke: #f59e0b; }
    .s-stopped { stroke: #5b8def; }
    .s-failed { stroke: #ef4444; }
    .s-orphaned { stroke: #a78bfa; }
    .arrow { stroke: #2a3040; stroke-width: 1.2; fill: none; marker-end: url(#sa); }
    .arrow-label { fill: #7a7f94; font-size: 8px; }
  </style>
  <defs>
    <marker id="sa" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#2a3040"/>
    </marker>
  </defs>

  <!-- Created -->
  <rect class="state s-created" x="20" y="40" width="100" height="36"/>
  <text class="label" x="70" y="62" text-anchor="middle">Created</text>

  <!-- Running -->
  <rect class="state s-running" x="200" y="40" width="100" height="36"/>
  <text class="label" x="250" y="62" text-anchor="middle">Running</text>

  <!-- Stopped -->
  <rect class="state s-stopped" x="420" y="40" width="100" height="36"/>
  <text class="label" x="470" y="62" text-anchor="middle">Stopped</text>

  <!-- Paused -->
  <rect class="state s-paused" x="200" y="140" width="100" height="36"/>
  <text class="label" x="250" y="162" text-anchor="middle">Paused</text>

  <!-- Failed -->
  <rect class="state s-failed" x="420" y="140" width="100" height="36"/>
  <text class="label" x="470" y="162" text-anchor="middle">Failed</text>

  <!-- Orphaned -->
  <rect class="state s-orphaned" x="420" y="210" width="100" height="36"/>
  <text class="label" x="470" y="232" text-anchor="middle">Orphaned</text>

  <!-- Created -> Running -->
  <line class="arrow" x1="120" y1="58" x2="198" y2="58"/>

  <!-- Running -> Stopped -->
  <line class="arrow" x1="300" y1="58" x2="418" y2="58"/>
  <text class="arrow-label" x="355" y="50" text-anchor="middle">exit</text>

  <!-- Running -> Paused -->
  <line class="arrow" x1="250" y1="76" x2="250" y2="138"/>
  <text class="arrow-label" x="262" y="110" text-anchor="start">pause</text>

  <!-- Paused -> Running -->
  <line class="arrow" x1="230" y1="140" x2="230" y2="78"/>
  <text class="arrow-label" x="210" y="110" text-anchor="end">resume</text>

  <!-- Running -> Failed -->
  <line class="arrow" x1="300" y1="70" x2="418" y2="148"/>
  <text class="arrow-label" x="370" y="100" text-anchor="middle">error</text>

  <!-- Paused -> Stopped -->
  <line class="arrow" x1="300" y1="158" x2="418" y2="158"/>
  <text class="arrow-label" x="355" y="150" text-anchor="middle">stop</text>

  <!-- Running -> Orphaned on every daemon restart -->
  <line class="arrow" x1="280" y1="76" x2="418" y2="222"/>
  <text class="arrow-label" x="320" y="170" text-anchor="start">daemon restart</text>
  <text class="arrow-label" x="320" y="180" text-anchor="start">(any PID state)</text>
  <text class="arrow-label" x="250" y="190" text-anchor="middle">restart: keep Paused only if PID alive</text>
  <text class="arrow-label" x="250" y="201" text-anchor="middle">and cgroup.freeze=1; otherwise Orphaned</text>
</svg>

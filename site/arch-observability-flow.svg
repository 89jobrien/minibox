<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" fill="none"><style>text{font-family:"SF Mono","JetBrains Mono","Fira Code",monospace}.label{fill:#dfe1e8;font-size:11px;font-weight:600}.desc{fill:#7a7f94;font-size:9px}.title{fill:#dfe1e8;font-size:13px;font-weight:700}.source{fill:#111a1f;stroke:#5b8def;stroke-width:1.5;rx:6}.event{fill:#14171f;stroke:#34d399;stroke-width:1.4;rx:5}.metric{fill:#14171f;stroke:#f59e0b;stroke-width:1.4;rx:5}.trace{fill:#1a1220;stroke:#a78bfa;stroke-width:1.4;rx:5}.sink{fill:#14171f;stroke:#2a3040;stroke-width:1.3;rx:5}.arrow{stroke:#2a3040;stroke-width:1.2;fill:none;marker-end:url(#a)}.green{stroke:#34d399;stroke-width:1.3;fill:none;marker-end:url(#g)}.orange{stroke:#f59e0b;stroke-width:1.3;fill:none;marker-end:url(#o)}.purple{stroke:#a78bfa;stroke-width:1.3;fill:none;marker-end:url(#p)}</style><defs><marker id="a" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#2a3040"/></marker><marker id="g" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#34d399"/></marker><marker id="o" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#f59e0b"/></marker><marker id="p" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#a78bfa"/></marker></defs><text class="title" x="380" y="22" text-anchor="middle">Events, metrics, tracing, and read-only TUI</text><rect class="source" x="245" y="46" width="270" height="58"/><text class="label" x="380" y="69" text-anchor="middle">daemon handlers + selected adapters</text><text class="desc" x="380" y="86" text-anchor="middle">operations, lifecycle transitions, structured spans</text><path class="green" d="M300 104V142H120V162"/><path class="orange" d="M380 104V162"/><path class="purple" d="M460 104V142H640V162"/>
<rect class="event" x="30" y="164" width="180" height="60"/><text class="label" x="120" y="184" text-anchor="middle">EventSink</text><text class="desc" x="120" y="200" text-anchor="middle">BroadcastEventBroker</text><text class="desc" x="120" y="213" text-anchor="middle">EventSource subscription</text><rect class="metric" x="290" y="164" width="180" height="60"/><text class="label" x="380" y="184" text-anchor="middle">MetricsRecorder</text><text class="desc" x="380" y="200" text-anchor="middle">Prometheus or NoOp</text><text class="desc" x="380" y="213" text-anchor="middle">counter • histogram • gauge</text><rect class="trace" x="550" y="164" width="180" height="60"/><text class="label" x="640" y="184" text-anchor="middle">tracing subscriber</text><text class="desc" x="640" y="200" text-anchor="middle">fmt + EnvFilter</text><text class="desc" x="640" y="213" text-anchor="middle">optional OTEL layer</text><line class="green" x1="120" y1="224" x2="120" y2="266"/><line class="orange" x1="380" y1="224" x2="380" y2="266"/><line class="purple" x1="640" y1="224" x2="640" y2="266"/>
<rect class="sink" x="30" y="268" width="180" height="56"/><text class="label" x="120" y="288" text-anchor="middle">daemon Event responses</text><text class="desc" x="120" y="304" text-anchor="middle">SubscribeEvents stream</text><text class="desc" x="120" y="316" text-anchor="middle">non-terminal until disconnect</text><rect class="sink" x="290" y="268" width="180" height="56"/><text class="label" x="380" y="288" text-anchor="middle">Prometheus HTTP</text><text class="desc" x="380" y="304" text-anchor="middle">feature-gated /metrics</text><text class="desc" x="380" y="316" text-anchor="middle">same injected recorder</text><rect class="sink" x="550" y="268" width="180" height="56"/><text class="label" x="640" y="288" text-anchor="middle">logs + OTLP</text><text class="desc" x="640" y="304" text-anchor="middle">local structured output</text><text class="desc" x="640" y="316" text-anchor="middle">optional batch span export</text><path class="green" d="M120 324V350H260"/><path class="arrow" d="M210 364H260"/><rect class="event" x="262" y="344" width="236" height="58"/><text class="label" x="380" y="365" text-anchor="middle">minibox-tui (read-only)</text><text class="desc" x="380" y="381" text-anchor="middle">List every 1s + live Event tail</text><text class="desc" x="380" y="394" text-anchor="middle">no run / stop / exec controls</text><rect class="sink" x="30" y="344" width="180" height="58"/><text class="label" x="120" y="365" text-anchor="middle">container state</text><text class="desc" x="120" y="381" text-anchor="middle">DaemonRequest::List</text><text class="desc" x="120" y="394" text-anchor="middle">polled through socket client</text><text class="desc" x="620" y="365" text-anchor="middle">adapter composition varies:</text><text class="desc" x="620" y="380" text-anchor="middle">real, no-op, or disconnected</text><text class="desc" x="620" y="395" text-anchor="middle">event/metrics paths</text></svg>

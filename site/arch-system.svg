<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" fill="none"><style>text{font-family:"SF Mono","JetBrains Mono","Fira Code",monospace}.label{fill:#dfe1e8;font-size:11px;font-weight:600}.desc{fill:#7a7f94;font-size:9px}.title{fill:#dfe1e8;font-size:13px;font-weight:700}.zone{fill:#111a1f;stroke:#5b8def;stroke-width:1.5;rx:7}.box{fill:#14171f;stroke:#2a3040;stroke-width:1.2;rx:5}.surface{fill:#14171f;stroke:#34d399;stroke-width:1.4;rx:5}.policy{fill:#14171f;stroke:#f59e0b;stroke-width:1.4;rx:5}.trust{fill:#1a1220;stroke:#a78bfa;stroke-width:1.4;rx:5}.blocked{fill:#14171f;stroke:#ef4444;stroke-width:1.2;rx:5}.arrow{stroke:#34d399;stroke-width:1.4;fill:none;marker-end:url(#a)}.muted{stroke:#2a3040;stroke-width:1.1;fill:none;marker-end:url(#m)}.dash{stroke:#5b8def;stroke-width:1;stroke-dasharray:5 4}</style><defs><marker id="a" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#34d399"/></marker><marker id="m" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#2a3040"/></marker></defs>

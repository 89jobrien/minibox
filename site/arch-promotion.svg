<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 80" fill="none">
  <style>
    text { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace; }
    .label { fill: #dfe1e8; font-size: 11px; font-weight: 600; }
    .desc { fill: #7a7f94; font-size: 8px; }
    .tier { fill: #14171f; stroke-width: 1.5; rx: 6; }
    .t-exp { stroke: #f59e0b; }
    .t-plat { stroke: #a78bfa; }
    .t-core { stroke: #34d399; }
    .t-int { stroke: #7a7f94; }
    .arrow { stroke: #2a3040; stroke-width: 1.2; fill: none; marker-end: url(#pa); }
    .no-arrow { stroke: #ef4444; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="pa" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#2a3040"/>
    </marker>
  </defs>

  <!-- Experimental -->
  <rect class="tier t-exp" x="20" y="20" width="120" height="36"/>
  <text class="label" x="80" y="42" text-anchor="middle">Experimental</text>

  <!-- Arrow: Experimental -> Platform/Core -->
  <line class="arrow" x1="140" y1="38" x2="198" y2="38"/>
  <text class="desc" x="170" y="30" text-anchor="middle">gates met</text>

  <!-- Platform -->
  <rect class="tier t-plat" x="200" y="20" width="100" height="36"/>
  <text class="label" x="250" y="42" text-anchor="middle">Platform</text>

  <!-- Arrow: Platform -> Core -->
  <line class="arrow" x1="300" y1="38" x2="358" y2="38"/>
  <text class="desc" x="330" y="30" text-anchor="middle">gates met</text>

  <!-- Core -->
  <rect class="tier t-core" x="360" y="20" width="80" height="36"/>
  <text class="label" x="400" y="42" text-anchor="middle">Core</text>

  <!-- Internal (separate, no promotion) -->
  <rect class="tier t-int" x="470" y="20" width="80" height="36"/>
  <text class="label" x="510" y="42" text-anchor="middle">Internal</text>
  <text class="desc" x="510" y="68" text-anchor="middle">never promoted</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" fill="none"><style>text{font-family:"SF Mono","JetBrains Mono","Fira Code",monospace}.label{fill:#dfe1e8;font-size:11px;font-weight:600}.desc{fill:#7a7f94;font-size:9px}.title{fill:#dfe1e8;font-size:13px;font-weight:700}.box{fill:#14171f;stroke:#5b8def;stroke-width:1.5;rx:6}.gate{fill:#14171f;stroke:#a78bfa;stroke-width:1.4;rx:5}.port{fill:#14171f;stroke:#f59e0b;stroke-width:1.4;rx:5}.life{stroke:#2a3040;stroke-width:1;stroke-dasharray:4 4}.req{stroke:#34d399;stroke-width:1.4;fill:none;marker-end:url(#g)}.resp{stroke:#5b8def;stroke-width:1.4;fill:none;marker-end:url(#b)}.note{fill:#0f1a14;stroke:#34d399;stroke-width:1;rx:4}</style><defs><marker id="g" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#34d399"/></marker><marker id="b" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#5b8def"/></marker></defs><text class="title" x="380" y="22" text-anchor="middle">Request / response sequence through miniboxd</text>
<rect class="box" x="20" y="42" width="105" height="38"/><text class="label" x="72" y="65" text-anchor="middle">DaemonClient</text><rect class="gate" x="165" y="42" width="110" height="38"/><text class="label" x="220" y="65" text-anchor="middle">accept + auth</text><rect class="gate" x="315" y="42" width="110" height="38"/><text class="label" x="370" y="59" text-anchor="middle">bounded frame</text><text class="desc" x="370" y="72" text-anchor="middle">parse JSON</text><rect class="box" x="465" y="42" width="110" height="38"/><text class="label" x="520" y="65" text-anchor="middle">dispatch</text><rect class="port" x="615" y="42" width="125" height="38"/><text class="label" x="677" y="59" text-anchor="middle">handler + ports</text><text class="desc" x="677" y="72" text-anchor="middle">selected adapters</text>
<line class="life" x1="72" y1="80" x2="72" y2="360"/><line class="life" x1="220" y1="80" x2="220" y2="360"/><line class="life" x1="370" y1="80" x2="370" y2="360"/><line class="life" x1="520" y1="80" x2="520" y2="360"/><line class="life" x1="677" y1="80" x2="677" y2="360"/><line class="req" x1="72" y1="112" x2="218" y2="112"/><text class="desc" x="145" y="104" text-anchor="middle">connect Unix socket</text><line class="req" x1="72" y1="145" x2="368" y2="145"/><text class="desc" x="220" y="137" text-anchor="middle">one tagged DaemonRequest + newline</text><line class="req" x1="220" y1="178" x2="368" y2="178"/><text class="desc" x="294" y="170" text-anchor="middle">authorized stream</text><line class="req" x1="370" y1="212" x2="518" y2="212"/><text class="desc" x="444" y="204" text-anchor="middle">typed request</text><line class="req" x1="520" y1="246" x2="675" y2="246"/><text class="desc" x="598" y="238" text-anchor="middle">mpsc sender + shared state</text><line class="resp" x1="677" y1="280" x2="518" y2="280"/><text class="desc" x="598" y="272" text-anchor="middle">0..n DaemonResponse</text><line class="resp" x1="520" y1="314" x2="74" y2="314"/><text class="desc" x="297" y="306" text-anchor="middle">serialize each response + newline; flush</text><rect class="note" x="205" y="333" width="350" height="34"/><text class="desc" x="380" y="347" text-anchor="middle">continue while non-terminal</text><text class="desc" x="380" y="360" text-anchor="middle">stop on terminal response or channel/socket close</text><text class="desc" x="220" y="377" text-anchor="middle">native suite: UID 0 required</text><text class="desc" x="370" y="377" text-anchor="middle">maximum frame: 1 MiB</text></svg>

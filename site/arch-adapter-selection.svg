<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" fill="none"><style>text{font-family:"SF Mono","JetBrains Mono","Fira Code",monospace}.label{fill:#dfe1e8;font-size:11px;font-weight:600}.desc{fill:#7a7f94;font-size:9px}.title{fill:#dfe1e8;font-size:13px;font-weight:700}.decision{fill:#111a1f;stroke:#5b8def;stroke-width:1.5}.box{fill:#14171f;stroke:#34d399;stroke-width:1.4;rx:5}.exp{fill:#14171f;stroke:#f59e0b;stroke-width:1.4;rx:5}.blocked{fill:#14171f;stroke:#ef4444;stroke-width:1.3;rx:5}.arrow{stroke:#2a3040;stroke-width:1.2;fill:none;marker-end:url(#a)}.green{stroke:#34d399;stroke-width:1.3;fill:none;marker-end:url(#g)}</style><defs><marker id="a" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#2a3040"/></marker><marker id="g" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#34d399"/></marker></defs><text class="title" x="380" y="22" text-anchor="middle">Adapter selection and capability boundaries</text><polygon class="decision" points="380,44 500,82 380,120 260,82"/><text class="label" x="380" y="79" text-anchor="middle">explicit adapter?</text><text class="desc" x="380" y="94" text-anchor="middle">CLI &gt; env &gt; config</text><path class="arrow" d="M260 82H112V142"/><text class="desc" x="184" y="73" text-anchor="middle">yes</text><rect class="exp" x="28" y="144" width="168" height="55"/><text class="label" x="112" y="165" text-anchor="middle">validate exact choice</text><text class="desc" x="112" y="181" text-anchor="middle">unknown / unavailable = error</text><text class="desc" x="112" y="192" text-anchor="middle">no fallback</text><path class="green" d="M380 120V144"/><text class="desc" x="391" y="136">no</text><polygon class="decision" points="380,144 500,182 380,220 260,182"/><text class="label" x="380" y="178" text-anchor="middle">smolvm probe</text><text class="desc" x="380" y="193" text-anchor="middle">binary on PATH?</text><path class="green" d="M500 182H612V238"/><text class="desc" x="555" y="174" text-anchor="middle">present</text><rect class="exp" x="532" y="240" width="160" height="48"/><text class="label" x="612" y="260" text-anchor="middle">smolvm</text><text class="desc" x="612" y="276" text-anchor="middle">experimental VM suite</text><path class="arrow" d="M380 220V242"/><text class="desc" x="390" y="235">absent</text><polygon class="decision" points="380,242 482,275 380,308 278,275"/><text class="label" x="380" y="280" text-anchor="middle">host OS</text><path class="green" d="M278 275H200V326"/><text class="desc" x="232" y="267" text-anchor="middle">Linux</text><rect class="box" x="120" y="328" width="160" height="48"/><text class="label" x="200" y="348" text-anchor="middle">native</text><text class="desc" x="200" y="364" text-anchor="middle">production • root required</text><path class="green" d="M482 275H560V326"/><text class="desc" x="526" y="267" text-anchor="middle">macOS</text><rect class="exp" x="480" y="328" width="160" height="48"/><text class="label" x="560" y="348" text-anchor="middle">krun</text><text class="desc" x="560" y="364" text-anchor="middle">experimental VM fallback</text><path class="arrow" d="M112 199V400H298"/><path class="arrow" d="M200 376V400H298"/><path class="arrow" d="M560 376V400H462"/><path class="arrow" d="M612 288V400H462"/><rect class="box" x="300" y="384" width="160" height="34"/><text class="label" x="380" y="405" text-anchor="middle">compose port suite</text><rect class="box" x="28" y="236" width="168" height="55"/><text class="label" x="112" y="256" text-anchor="middle">also selectable</text><text class="desc" x="112" y="272" text-anchor="middle">GKE production • Colima exp.</text><text class="desc" x="112" y="283" text-anchor="middle">when platform/build permits</text><rect class="blocked" x="28" y="316" width="168" height="55"/><text class="label" x="112" y="337" text-anchor="middle">not working paths</text><text class="desc" x="112" y="353" text-anchor="middle">VZ boot-blocked • winbox stub</text><text class="desc" x="112" y="364" text-anchor="middle">not fallback targets</text><text class="desc" x="650" y="412" text-anchor="middle">optional/no-op ports expose gaps</text></svg>

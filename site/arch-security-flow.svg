<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" fill="none"><style>text{font-family:"SF Mono","JetBrains Mono","Fira Code",monospace}.label{fill:#dfe1e8;font-size:11px;font-weight:600}.desc{fill:#7a7f94;font-size:9px}.title{fill:#dfe1e8;font-size:13px;font-weight:700}.gate{fill:#14171f;stroke:#a78bfa;stroke-width:1.4;rx:5}.policy{fill:#14171f;stroke:#f59e0b;stroke-width:1.4;rx:5}.integrity{fill:#14171f;stroke:#5b8def;stroke-width:1.4;rx:5}.exec{fill:#0f1a14;stroke:#34d399;stroke-width:1.5;rx:5}.arrow{stroke:#34d399;stroke-width:1.3;fill:none;marker-end:url(#a)}.boundary{stroke:#ef4444;stroke-width:1;stroke-dasharray:6 4}.boundary-label{fill:#ef4444;font-size:8px;font-weight:700}</style><defs><marker id="a" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#34d399"/></marker></defs><text class="title" x="380" y="22" text-anchor="middle">Distinct security and policy trust checks</text>
<rect class="policy" x="20" y="52" width="150" height="52"/><text class="label" x="95" y="72" text-anchor="middle">agent policy</text><text class="desc" x="95" y="87" text-anchor="middle">MCP mutation / mount /</text><text class="desc" x="95" y="98" text-anchor="middle">privilege / host-net gates</text><rect class="gate" x="195" y="52" width="150" height="52"/><text class="label" x="270" y="72" text-anchor="middle">socket access</text><text class="desc" x="270" y="87" text-anchor="middle">mode + peer credentials</text><text class="desc" x="270" y="98" text-anchor="middle">native root-auth</text><rect class="gate" x="370" y="52" width="150" height="52"/><text class="label" x="445" y="72" text-anchor="middle">framing + decode</text><text class="desc" x="445" y="87" text-anchor="middle">1 MiB bound</text><text class="desc" x="445" y="98" text-anchor="middle">tagged typed JSON</text><rect class="policy" x="545" y="52" width="195" height="52"/><text class="label" x="642" y="72" text-anchor="middle">daemon ContainerPolicy</text><text class="desc" x="642" y="87" text-anchor="middle">bind mounts + privileged + priority</text><text class="desc" x="642" y="98" text-anchor="middle">deny defaults, operator override</text><line class="arrow" x1="170" y1="78" x2="193" y2="78"/><line class="arrow" x1="345" y1="78" x2="368" y2="78"/><line class="arrow" x1="520" y1="78" x2="543" y2="78"/>
<line class="boundary" x1="12" y1="126" x2="748" y2="126"/><text class="boundary-label" x="735" y="121" text-anchor="end">UNTRUSTED INPUT → DAEMON-VALIDATED INTENT</text><rect class="integrity" x="40" y="152" width="200" height="68"/><text class="label" x="140" y="173" text-anchor="middle">image pull integrity</text><text class="desc" x="140" y="189" text-anchor="middle">manifest / layer / aggregate limits</text><text class="desc" x="140" y="202" text-anchor="middle">content digest verification</text><text class="desc" x="140" y="215" text-anchor="middle">registry routing</text><rect class="integrity" x="280" y="152" width="200" height="68"/><text class="label" x="380" y="173" text-anchor="middle">filesystem containment</text><text class="desc" x="380" y="189" text-anchor="middle">tar + overlay path validation</text><text class="desc" x="380" y="202" text-anchor="middle">device rejection • mode stripping</text><text class="desc" x="380" y="215" text-anchor="middle">bind destination checks</text><rect class="policy" x="520" y="152" width="200" height="68"/><text class="label" x="620" y="173" text-anchor="middle">execution manifest</text><text class="desc" x="620" y="189" text-anchor="middle">seal measured inputs before spawn</text><text class="desc" x="620" y="202" text-anchor="middle">optional ExecutionPolicy admission</text><text class="desc" x="620" y="215" text-anchor="middle">env values stored as SHA-256</text><path class="arrow" d="M642 104V134H140V150"/><path class="arrow" d="M642 104V134H380V150"/><path class="arrow" d="M642 104V150"/>
<line class="boundary" x1="12" y1="246" x2="748" y2="246"/><text class="boundary-label" x="735" y="241" text-anchor="end">VERIFIED ASSETS → CHILD EXECUTION BOUNDARY</text><rect class="exec" x="40" y="274" width="150" height="62"/><text class="label" x="115" y="295" text-anchor="middle">namespace + rootfs</text><text class="desc" x="115" y="311" text-anchor="middle">clone • bind • pivot_root</text><text class="desc" x="115" y="324" text-anchor="middle">cgroup attachment</text><rect class="exec" x="215" y="274" width="150" height="62"/><text class="label" x="290" y="295" text-anchor="middle">mount ratchet</text><text class="desc" x="290" y="311" text-anchor="middle">deny remount,rw</text><text class="desc" x="290" y="324" text-anchor="middle">after init mounts</text><rect class="exec" x="390" y="274" width="150" height="62"/><text class="label" x="465" y="295" text-anchor="middle">process hygiene</text><text class="desc" x="465" y="311" text-anchor="middle">close fds &gt; 2</text><text class="desc" x="465" y="324" text-anchor="middle">capability whitelist if privileged</text><rect class="exec" x="565" y="274" width="150" height="62"/><text class="label" x="640" y="295" text-anchor="middle">execve</text><text class="desc" x="640" y="311" text-anchor="middle">explicit argv + envp</text><text class="desc" x="640" y="324" text-anchor="middle">no daemon env inheritance</text><line class="arrow" x1="115" y1="336" x2="115" y2="366"/><line class="arrow" x1="290" y1="336" x2="290" y2="366"/><line class="arrow" x1="465" y1="336" x2="465" y2="366"/><line class="arrow" x1="640" y1="336" x2="640" y2="366"/><rect class="exec" x="170" y="368" width="420" height="44"/><text class="label" x="380" y="387" text-anchor="middle">isolated workload process tree</text><text class="desc" x="380" y="402" text-anchor="middle">each preceding gate protects a different asset and failure mode</text><text class="desc" x="380" y="432" text-anchor="middle">passing socket auth does not bypass policy, image verification, path checks, or child isolation</text></svg>

      FAT image differed byte-wise because fatfs's default chrono feature stamped
      directory entries with Local::now(). Verified with
      vm_image::tests::fat_image_is_deterministic_and_contains_every_file after the
      fix; all 8 vm_image tests pass, plus 2 vm_boot tests in minibox-core.
      Pre-commit gates passed (fmt/clippy/architecture), but the shell environment
      broke mid-session (see vb-env-1), so the commit may or may not have landed;
      confirm with `git log --oneline -3` and re-run targeted tests if needed.
    files:
      - xtask/Cargo.toml
      - Cargo.lock
  - id: vb-open-2
    name: vz-efi-phase-1
    title: Phase 1 EFI boot — landed (by concurrent agents' commits)
    status: merged_to_develop
    description: >-
      Commits 9200022e (probe/Phase 0), e9ec4b5c (T1 signing/doctor), 4cd2fa47
      (T2/T3: cargo xtask build-vm-image + VZEFIBootLoader adapter), 6d8c009a
      (T4/T5: boot-mode resolution, preflight, code=1 remediation), 538bfe90
      (isolation handshake + VZ EFI-boot net/module diagnostics). Verified end to
      end on a signed vz daemon: firmware → GRUB → Alpine virt kernel mounts a
      virtiofs root (tag minibox-rootfs) via appended cpio modules; cmdline is baked
      into /boot/grub/grub.cfg since VZEFIBootLoader has no cmdline field. The vsock
      transport modules are appended the same way (Alpine virt initramfs lacks them).
    remaining:

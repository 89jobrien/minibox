- id: smolvm-docker-465
  doob_uuid: null
  name: smolvm-pull-fails-guest-vm-lacks-docker
  priority: P1
  status: open
  title: 'smolvm pull fails: guest VM lacks docker (GH #465)'
  description: |-
    `cargo xtask demo --filter lifecycle` panics during the pull step.
    SmolVmRegistry (crates/minibox/src/adapters/smolvm.rs) shells out to
    `docker pull`/`docker load`/`docker tag` inside the smolvm guest VM, but
    the guest defaults to a plain, unprovisioned ubuntu:24.04 image with no
    docker installed, and nothing in this repo provisions it.
    SmolVmRegistry::new() has no `.with_image()` override wired in production
    (crates/miniboxd/src/main.rs:945). docs/PLATFORM_SUPPORT.md's smolvm
    prerequisites don't mention the guest-side docker dependency.
    Root cause + fix options: minibox issue #465 (89jobrien/minibox)
  files:
  - crates/minibox/src/adapters/smolvm.rs
  - crates/miniboxd/src/main.rs
  - docs/PLATFORM_SUPPORT.md
  completed: null
  extra: []

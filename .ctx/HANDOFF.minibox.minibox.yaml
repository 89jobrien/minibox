- id: smolvm-adapter-output-reader
  doob_uuid: null
  name: smolvm-adapter-output-reader
  priority: P0
  status: done
  title: Fix smolvm adapter output_reader bug
  description: |-
    spawn_process returned output_reader: None, causing all minibox run
    commands to fail with "capture_output=true but runtime returned no
    output_reader". Fixed by piping synchronous smolvm output into an
    OwnedFd via nix::unistd::pipe(). Also fixed: non-zero exit codes were
    swallowed (smolvm_exec_full returned Err on any non-zero exit); now
    stores exit code in Mutex for wait_for_exit. Timeout increased 60s→600s.
  files:
  - crates/minibox/src/adapters/smolvm.rs
  completed: 2026-05-23
  extra: []

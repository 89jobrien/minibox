[package]
name = "minibox-crux-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Crux plugin binary exposing minibox container operations via JSON-RPC stdio"

[lib]
name = "minibox_crux_plugin"
path = "src/lib.rs"

[[bin]]
name = "minibox-crux-plugin"
path = "src/main.rs"

[dependencies]
minibox-core = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
crux-plugin = { version = "0.2.6", git = "https://github.com/89jobrien/crux", rev = "6cfb95eb5614d4938aacb6de48d0db92619db59d" }

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

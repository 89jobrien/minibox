[package]
name = "macbox"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
vz = ["dep:block2", "dep:objc2", "dep:objc2-foundation", "dep:objc2-virtualization", "dep:serde_json"]
# Phase 0 boot probe (crates/macbox/examples/vz_boot_probe.rs). Kept separate from `vz` so
# the shipped adapter's Virtualization.framework surface stays unchanged until the gate
# in docs/designs/2026-10-22-vz-efi-boot-design.md has been decided.
vz-probe = [
    "vz",
    "objc2-virtualization/VZEFIBootLoader",
    "objc2-virtualization/VZEFIVariableStore",
    "objc2-virtualization/VZPlatformConfiguration",
    "objc2-virtualization/VZGenericPlatformConfiguration",
    "objc2-virtualization/VZStorageDeviceConfiguration",
    "objc2-virtualization/VZStorageDeviceAttachment",
    "objc2-virtualization/VZDiskImageStorageDeviceAttachment",
    "objc2-virtualization/VZVirtioBlockDeviceConfiguration",
]

[dependencies]
minibox = { workspace = true }
minibox-core = { workspace = true }
minibox-signpost = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }
libc = "0.2"
which = "8"
uuid = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, features = ["NSString", "NSURL", "NSArray", "NSFileHandle"] }
objc2-virtualization = { version = "0.3", optional = true, features = [
    "VZBootLoader",
    "VZDirectoryShare",
    "VZDirectorySharingDeviceConfiguration",
    "VZSerialPortAttachment",
    "VZSerialPortConfiguration",
    "VZSharedDirectory",
    "VZSocketDevice",
    "VZSocketDeviceConfiguration",
    "VZVirtualMachine",
    "VZVirtualMachineConfiguration",
    "VZVirtioSocketConnection",
    "VZVirtioSocketDevice",
    "VZVirtioSocketDeviceConfiguration",
] }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
minibox-macros = { workspace = true }
tempfile = { workspace = true }
base64 = { workspace = true }
nix = { workspace = true }

[[test]]
name = "vz_isolation_tests"
harness = false

[[test]]
name = "krun_conformance_tests"

[[test]]
name = "krun_adapter_conformance"

# Phase 0 experiment for docs/designs/2026-10-22-vz-efi-boot-design.md.
[[example]]
name = "vz_boot_probe"
required-features = ["vz-probe"]

[lints]
workspace = true

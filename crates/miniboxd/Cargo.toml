[package]
name = "miniboxd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true
[package.metadata.cargo-machete]
ignored = ["tracing-subscriber"]

[lib]
name = "miniboxd"
path = "src/lib.rs"

[[bin]]
name = "miniboxd"
path = "src/main.rs"

[features]
default = ["metrics", "otel"]
metrics = ["minibox/metrics"]
otel    = ["minibox/otel"]
cni     = ["minibox/cni", "dep:minibox-cni"]
vz      = ["macbox/vz"]
# tailnet is a reserved gate only: the provider lives in the external tailbox
# crate, which is not a workspace member. Nothing gates on this feature today;
# resolve_native_network reports tailnet as unavailable on every build.
tailnet = []

[dependencies]
# minibox is Unix-centric (uses nix) but must stay in [dependencies] (not a
# target-conditional section) so that the metrics/otel features can forward to
# minibox/metrics and minibox/otel. All Linux-only code inside minibox is
# guarded by #[cfg(target_os = "linux")] at the module level.
minibox = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
toml = "1.1"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(unix)'.dependencies]
minibox-core = { workspace = true }
# `resolve_native_network` constructs minibox_cni::CniNetworkProvider directly
# under #[cfg(feature = "cni")], so miniboxd needs the crate as a direct
# dependency — forwarding through minibox/cni alone leaves the path unresolvable.
minibox-cni = { workspace = true, optional = true }
macbox = { workspace = true }
smolbox = { workspace = true }
nix = { workspace = true }
libc = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
winbox = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
libc = { workspace = true }
uuid = { workspace = true }
serde_json = "1"
serial_test = { workspace = true }
async-trait = { workspace = true }
minibox-core = { workspace = true, features = ["test-utils"] }
minibox = { workspace = true, features = ["test-utils"] }
minibox-testsuite = { workspace = true }
proptest = "1"
turmoil = { workspace = true }
minibox-macros = { workspace = true }

[package]
name = "minibox"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true
[dependencies]
minibox-core = { workspace = true, features = ["test-utils"] }
minibox-cni = { workspace = true, optional = true }
minibox-macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
miette = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
nix = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true, optional = true }
tempfile = { workspace = true }
async-trait = { workspace = true }
walkdir = { workspace = true }
tokio-util = { workspace = true }
tar = { workspace = true }
sha2 = { workspace = true }
flate2 = { workspace = true }
ipnet = { workspace = true }
dashmap = { workspace = true }
tracing-subscriber = { workspace = true }
slashcrux = { workspace = true }

# Optional: Prometheus metrics endpoint (feature = "metrics")
prometheus-client = { workspace = true, optional = true }
axum             = { workspace = true, optional = true }

# Optional: OTLP trace export (feature = "otel")
opentelemetry        = { workspace = true, optional = true }
opentelemetry_sdk    = { workspace = true, optional = true }
opentelemetry-otlp   = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

[features]
## Test infrastructure: mocks, fixtures, conformance helpers.
## Enabled by default (crate is not published; test utils needed for cargo nextest compile-tests).
default = ["test-utils", "registry"]
test-utils = ["minibox-core/test-utils"]
## OCI registry client (reqwest-based image pull/push, GHCR). Disabling this
## drops ~108 transitive dependencies for local-only container management
## builds. See issue #447.
registry = ["dep:reqwest", "minibox-core/registry"]
## Prometheus /metrics endpoint + prometheus-client recorder
metrics = ["dep:prometheus-client", "dep:axum"]
## OTLP trace export via opentelemetry + tonic
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]
## CNI (Container Network Interface) plugin-based bridge networking for the
## native Linux adapter. Requires CNI plugin binaries (bridge, host-local,
## portmap, dnsname) installed and MINIBOX_CNI_PATH set — see
## docs/PLATFORM_SUPPORT.md. Off by default: with it disabled, the native
## suite keeps constructing the existing bespoke BridgeNetwork.
cni = ["dep:minibox-cni"]

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[[test]]
name = "conformance_push"
path = "tests/conformance_push.rs"
required-features = ["registry"]

[dev-dependencies]
proptest = "1"
wiremock = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
hex = { workspace = true }
tempfile = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
macbox = { workspace = true }
shuttle = "0.9"
# Enable conformance test infrastructure from minibox-core.
minibox-core = { workspace = true, features = ["test-utils"] }
turmoil = { workspace = true }

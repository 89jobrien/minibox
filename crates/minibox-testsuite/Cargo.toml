[package]
name = "minibox-testsuite"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Conformance test harness for minibox adapter trait contracts"
publish = false

[[bin]]
name = "run-conformance"
path = "src/bin/run_conformance.rs"

[[bin]]
name = "generate-report"
path = "src/bin/generate_report.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
minibox = { workspace = true, features = ["test-utils"] }
minibox-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
slashcrux = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
tempfile = { workspace = true }
inventory = { workspace = true }
paste = { workspace = true }
miette = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[lints]
workspace = true

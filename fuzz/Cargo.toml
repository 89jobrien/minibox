[package]
name = "minibox-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
tempfile = "3"

[dependencies.minibox-core]
path = "../crates/minibox-core"
features = ["fuzzing"]

[dependencies.minibox]
path = "../crates/minibox"

[dependencies.minibox-crux-plugin]
path = "../crates/minibox-crux-plugin"

# ── minibox-core targets ────────────────────────────────────────────────────────

[[bin]]
name = "fuzz_decode_request"
path = "fuzz_targets/fuzz_decode_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decode_response"
path = "fuzz_targets/fuzz_decode_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_extract_layer"
path = "fuzz_targets/fuzz_extract_layer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_validate_tar_path"
path = "fuzz_targets/fuzz_validate_tar_path.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_parse_manifest"
path = "fuzz_targets/fuzz_parse_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_parse_platform"
path = "fuzz_targets/fuzz_parse_platform.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_parse_image_ref"
path = "fuzz_targets/fuzz_parse_image_ref.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_parse_dockerfile"
path = "fuzz_targets/fuzz_parse_dockerfile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_parse_www_authenticate"
path = "fuzz_targets/fuzz_parse_www_authenticate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_validate_cgroup_parent"
path = "fuzz_targets/fuzz_validate_cgroup_parent.rs"
test = false
doc = false
bench = false

# ── minibox-crux-plugin targets ─────────────────────────────────────────────────

[[bin]]
name = "fuzz_build_request"

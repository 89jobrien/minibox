name: CI

on:
  push:
    # TODO: add develop and next — current triggers miss all active dev branches
    branches: [main, staging, release]
  pull_request:
    # TODO: add develop so PRs targeting the primary dev branch are covered
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: taiki-e/install-action@nextest

      - uses: Swatinem/rust-cache@v2

      - name: Install taskit
        # TODO: remove fallback — `cargo install --path .` installs the repo root crate, not taskit
        run: cargo install taskit || cargo install --path .

      - name: Run CI pipeline
        run: cargo xtask ci --fail-fast

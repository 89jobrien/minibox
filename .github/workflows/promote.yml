name: Promote

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print plan without executing"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: promote
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0

jobs:
  promote:
    name: promote (develop -> main)
    runs-on: ubuntu-latest
    # A hung gate or a stalled container must fail the run, not park it
    # until the 6-hour default job limit expires.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: install crux
        run: >-
          cargo install --git https://github.com/89jobrien/crux.git
          --rev 8d54a65df7696ec01b1ef27a5c0972422020efc1
          crux-agentic --locked

      - name: install cargo-nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-nextest

      - name: configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: run promote pipeline
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: crux run .crux/promote.crux

      - name: dry run
        if: ${{ inputs.dry_run }}
        run: crux run -n .crux/promote.crux

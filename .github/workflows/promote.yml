name: Promote

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print plan without executing merges"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: promote
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0

jobs:
  promote:
    name: promote (develop -> main)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: install crux
        run: cargo install crux-agentic

      - name: install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: run promote pipeline
        if: ${{ !inputs.dry_run }}
        run: crux run .crux/promote.crux

      - name: dry run
        if: ${{ inputs.dry_run }}
        run: crux run -n .crux/promote.crux

name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"       # daily — geiger, tag, extended tests
    - cron: "0 3 * * 0"       # weekly (Sunday) — mutants
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  geiger:
    name: unsafe audit (geiger)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-geiger
        run: cargo install cargo-geiger --locked
      - name: cargo geiger
        id: geiger
        run: |
          geiger_status=0
          : > geiger-report.txt
          for manifest in \
            crates/minibox/Cargo.toml \
            crates/minibox-macros/Cargo.toml \
            crates/mbx/Cargo.toml \
            crates/minibox-core/Cargo.toml \
            crates/macbox/Cargo.toml \
            crates/winbox/Cargo.toml \
            crates/minibox-crux-plugin/Cargo.toml \
            crates/minibox-testsuite/Cargo.toml \
            crates/miniboxd/Cargo.toml
          do
            printf '\n## %s\n' "$manifest" | tee -a geiger-report.txt
            cargo geiger --manifest-path "$GITHUB_WORKSPACE/$manifest" 2>&1 | tee -a geiger-report.txt
            status=${PIPESTATUS[0]}
            if [ "$status" -ne 0 ]; then
              geiger_status="$status"
            fi
          done
          {
            echo "## cargo geiger report"
            echo '```'
            tail -30 geiger-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$geiger_status"
      - name: upload geiger report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geiger-report
          path: geiger-report.txt
          retention-days: 30

  mutants:
    name: mutation testing (cargo-mutants)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * 0'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-mutants
        run: cargo install cargo-mutants --locked
      - name: run cargo-mutants on security modules
        run: |
          cargo mutants -- \
            --file crates/minibox-core/src/image/layer.rs \
            --file crates/minibox/src/daemon/server.rs \
            --file crates/minibox-core/src/domain/execution_manifest.rs \
            --file crates/minibox/src/container/process.rs \
            --file crates/minibox-core/src/image/registry.rs \
            --file crates/minibox/src/adapters/ghcr.rs
      - name: upload mutants report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report
          path: mutants.out/
          retention-days: 30
      - name: summary
        if: always()
        run: |
          if [ -f mutants.out/caught.txt ]; then
            {
              echo "## cargo-mutants security scan"
              echo "### Caught"
              echo '```'
              head -50 mutants.out/caught.txt
              echo '```'
              if [ -f mutants.out/missed.txt ] && [ -s mutants.out/missed.txt ]; then
                echo "### Missed"
                echo '```'
                cat mutants.out/missed.txt
                echo '```'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # --- Extended test suites (moved from merge/conformance to reduce push latency) ---

  coverage-check:
    name: coverage check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: cargo xtask coverage-check
        run: cargo xtask coverage-check

  build-test-archive:
    name: build test archive
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: cargo build --locked
        run: cargo build --locked --workspace
      - name: cargo nextest archive
        run: cargo nextest archive --workspace --archive-file nextest-archive.tar.zst
      - name: upload test archive
        uses: actions/upload-artifact@v4
        with:
          name: nextest-archive
          path: nextest-archive.tar.zst
          retention-days: 1

  test-archive:
    name: test from archive (ubuntu)
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: build-test-archive
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: nextest-archive
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: run tests from archive
        run: >-
          cargo nextest run
          --archive-file nextest-archive.tar.zst
          --workspace-remap .
          -E 'not package(minibox-crux-plugin)
          and not binary_id(miniboxd::cli_e2e_tests)
          and not binary_id(miniboxd::smolvm_e2e_tests)
          and not binary_id(miniboxd::protocol_e2e_tests)'

  test-all-features:
    name: test with all features
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: build-test-archive
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: cargo nextest --all-features (lib, exclude macOS-only crates)
        run: cargo nextest run --all-features --workspace --exclude macbox --exclude miniboxd --lib
      - name: cargo test --all-features (doc)
        run: cargo test --all-features --workspace --exclude macbox --exclude miniboxd --doc

  shuttle:
    name: shuttle
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: run shuttle tests
        run: cargo xtask test-shuttle

  turmoil:
    name: turmoil
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: run turmoil tests
        run: cargo xtask test-turmoil

  tag-nightly:
    name: tag nightly release
    runs-on: ubuntu-latest
    needs: geiger
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: push nightly tag
        run: |
          TAG="nightly/$(date -u +%Y%m%d)"
          git tag "$TAG"
          git push origin "$TAG"

name: Stability Gates

on:
  # No `merge_group`: it and `pull_request` both test the synthetic merge, so
  # having both ran every stability gate two to three times per PR.
  push:
    branches:
      [
        develop,
        main,
        staging,
        release,
        "feature/*",
        "hotfix/*",
        "chore/*",
        "feat/*",
      ]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doc-sync:
    name: doc-sync (FEATURE_MATRIX staleness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: FEATURE_MATRIX must be updated within 90 days
        run: |
          LAST_COMMIT=$(git log -1 --format="%ct" -- docs/core/FEATURE_MATRIX.mbx.md)
          if [ -z "$LAST_COMMIT" ]; then
            echo "ERROR: docs/core/FEATURE_MATRIX.mbx.md has never been committed."
            exit 1
          fi
          NOW=$(date +%s)
          AGE_DAYS=$(( (NOW - LAST_COMMIT) / 86400 ))
          echo "docs/core/FEATURE_MATRIX.mbx.md last updated ${AGE_DAYS} days ago."
          if [ "$AGE_DAYS" -gt 90 ]; then
            echo "ERROR: FEATURE_MATRIX.mbx.md is stale (${AGE_DAYS} days). Update it before merging."
            exit 1
          fi
          echo "OK: within 90-day freshness window."
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cargo xtask docs audit (full, strict)
        run: cargo xtask docs audit --full --strict

  adapter-integration-tests:
    name: adapter integration test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cargo xtask check-adapter-coverage
        run: cargo xtask check-adapter-coverage

  no-unwrap-in-prod:
    name: no .unwrap() in production code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cargo xtask check-no-unwrap
        run: cargo xtask check-no-unwrap --strict

  stability-compile:
    name: stability compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cargo check workspace (stability gate)
        run: cargo check --workspace
      - name: clippy stability crates
        run: |
          cargo clippy \
            -p minibox-core \
            -p minibox \
            -p macbox \
            -p winbox \
            -- -D warnings

  check-stale-names:
    name: stale crate/binary name audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cargo xtask check-stale-names
        run: cargo xtask check-stale-names

  check-protocol-sites:
    name: HandlerDependencies construction site count
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cargo xtask check-protocol-sites
        run: cargo xtask check-protocol-sites crates/miniboxd/src/main.rs --expected 4

  handler-coverage:
    name: handler function coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-nextest
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-llvm-cov
      - name: cargo xtask coverage-check
        run: cargo xtask coverage-check

name: Release

on:
  push:
    tags:
      - "v*"
      - "nightly/*"

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-crates:
    name: Publish crates to crates.io
    runs-on: ubuntu-latest
    if: startsWith(github.ref_name, 'v')

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate public crates publishability
        run: |
          cargo publish --dry-run --locked -p minibox-macros
          cargo publish --dry-run --locked -p minibox-core
          cargo publish --dry-run --locked -p minibox-mcp

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          publish_crate() {
            local crate="$1"
            local output
            if output="$(cargo publish -p "$crate" 2>&1)"; then
              printf "%s\n" "$output"
            elif [[ "$output" == *"already uploaded"* ]]; then
              printf "%s is already published\n" "$crate"
            else
              printf "%s\n" "$output" >&2
              return 1
            fi
          }

          publish_crate minibox-macros
          sleep 30
          publish_crate minibox-domain
          sleep 30
          publish_crate minibox-core
          sleep 30
          cargo publish -p minibox-mcp || echo "minibox-mcp already published"
          sleep 30

  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-release-

      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cross

      - name: Build binaries
        run: |
          cross build --release --target ${{ matrix.target }} -p miniboxd -p mbx

      - name: Package
        run: |
          VERSION=${GITHUB_REF_NAME}
          TARGET=${{ matrix.target }}
          ARCHIVE="minibox-${VERSION//\//-}-${TARGET}.tar.gz"
          mkdir -p dist
          cp target/${{ matrix.target }}/release/miniboxd dist/
          cp target/${{ matrix.target }}/release/mbx dist/
          tar -czf "${ARCHIVE}" -C dist miniboxd mbx

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: minibox-${{ matrix.target }}
          path: "*.tar.gz"
          retention-days: 1

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: ${{ startsWith(github.ref_name, 'nightly/') }}

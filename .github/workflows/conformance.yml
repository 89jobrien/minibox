name: Conformance

on:
  push:
    branches: [develop, staging, release]
  pull_request:
    branches: [develop, staging, release]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

jobs:
  detect-changes:
    # Distinct from merge.yml's identically-named job: job outputs do not
    # cross workflows, so conformance needs its own change detection.
    name: detect changes (conformance)
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.dc.outputs.core }}
      runtime: ${{ steps.dc.outputs.runtime }}
      conformance: ${{ steps.dc.outputs.conformance }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: detect changes
        id: dc
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$BASE_REF"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            BASE="origin/main"
          else
            BASE="HEAD^"
          fi
          cargo xtask detect-changes "$BASE"

  conformance:
    name: conformance suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [detect-changes]
    if: |
      needs.detect-changes.outputs.core == 'true' ||
      needs.detect-changes.outputs.runtime == 'true' ||
      needs.detect-changes.outputs.conformance == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: run conformance suite
        run: cargo run -p minibox-testsuite --bin run-conformance

      - name: upload conformance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conformance-report-${{ matrix.os }}
          path: artifacts/conformance/
          retention-days: 30

      - name: post summary
        if: always()
        run: |
          REPORT=artifacts/conformance/report.md
          if [ -f "$REPORT" ]; then
            echo "## Conformance Report (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          fi

  property-tests:
    name: property tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [detect-changes]
    if: |
      needs.detect-changes.outputs.core == 'true' ||
      needs.detect-changes.outputs.runtime == 'true' ||
      needs.detect-changes.outputs.conformance == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: run property tests
        run: cargo xtask test-property

  krun-conformance:
    name: krun conformance
    runs-on: macos-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.conformance == 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: run krun conformance
        run: cargo xtask test-krun-conformance

  cli-conformance:
    name: CLI conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [detect-changes]
    if: needs.detect-changes.outputs.conformance == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@badb8c3638e0b773c6c17a6025c2306a8f1c4303 # nextest
      - name: run CLI conformance
        run: cargo nextest run -p minibox-cli --test conformance_cli

  borrow-fixtures:
    name: borrow fixtures
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: |
      needs.detect-changes.outputs.core == 'true' ||
      needs.detect-changes.outputs.runtime == 'true' ||
      needs.detect-changes.outputs.conformance == 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: run borrow fixtures
        run: cargo xtask borrow-fixtures

  quickcheck:
    name: quickcheck (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [detect-changes]
    if: |
      needs.detect-changes.outputs.core == 'true' ||
      needs.detect-changes.outputs.runtime == 'true' ||
      needs.detect-changes.outputs.conformance == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: run quickcheck tests
        run: cargo xtask test-quickcheck

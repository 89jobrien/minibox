name: PR

on:
  pull_request:
    branches: [main, staging]

env:
  CARGO_INCREMENTAL: 0

jobs:
  detect-changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.dc.outputs.core }}
      daemon: ${{ steps.dc.outputs.daemon }}
      cli: ${{ steps.dc.outputs.cli }}
      runtime: ${{ steps.dc.outputs.runtime }}
      conformance: ${{ steps.dc.outputs.conformance }}
      xtask: ${{ steps.dc.outputs.xtask }}
      docs: ${{ steps.dc.outputs.docs }}
      workflows: ${{ steps.dc.outputs.workflows }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: detect changes
        id: dc
        env:
          BASE_REF: ${{ github.base_ref }}
        run: cargo xtask detect-changes "$BASE_REF"

  changelog-preview:
    name: changelog preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Generate unreleased changelog
        id: git_cliff
        continue-on-error: true
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4.9.0
        with:
          version: v2.14.1
          config: cliff.toml
          args: --unreleased --strip header --no-exec --github-repo ${{ github.repository }}
        env:
          OUTPUT: CHANGELOG_PREVIEW.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Publish changelog preview
        if: steps.git_cliff.outcome == 'success'
        run: |
          echo "## Changelog preview" >> "$GITHUB_STEP_SUMMARY"
          cat CHANGELOG_PREVIEW.md >> "$GITHUB_STEP_SUMMARY"

      - name: Report preview warning
        if: steps.git_cliff.outcome == 'failure'
        run: echo "::warning::git-cliff could not render the changelog preview"

  lint:
    name: lint + fmt
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: |
      needs.detect-changes.outputs.core == 'true' ||
      needs.detect-changes.outputs.daemon == 'true' ||
      needs.detect-changes.outputs.cli == 'true' ||
      needs.detect-changes.outputs.runtime == 'true' ||
      needs.detect-changes.outputs.xtask == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo xtask lint
        run: cargo xtask lint

  test-unit:
    name: unit tests
    runs-on: ubuntu-latest
    needs: [detect-changes, lint]
    if: |
      needs.detect-changes.outputs.core == 'true' ||
      needs.detect-changes.outputs.daemon == 'true' ||
      needs.detect-changes.outputs.cli == 'true' ||
      needs.detect-changes.outputs.runtime == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: cargo xtask test-unit
        run: cargo xtask test-unit

  docs:
    name: cargo doc
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: |
      needs.detect-changes.outputs.core == 'true' ||
      needs.detect-changes.outputs.daemon == 'true' ||
      needs.detect-changes.outputs.cli == 'true' ||
      needs.detect-changes.outputs.runtime == 'true' ||
      needs.detect-changes.outputs.xtask == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc (build check)
        env:
          RUSTDOCFLAGS: -D rustdoc::invalid_rust_codeblocks
        run: cargo doc --workspace --no-deps --all-features

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install actionlint
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          sudo mv actionlint /usr/local/bin/
      - name: run actionlint
        run: actionlint -config-file .github/actionlint.yaml .github/workflows/*.yml

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  ci-ok:
    name: CI passed
    runs-on: ubuntu-latest
    if: always()
    needs:
      - detect-changes
      - lint
      - test-unit
      - actionlint
      - audit
      - deny
    steps:
      - name: check job results
        run: |
          results=(
            "${{ needs.lint.result }}"
            "${{ needs.test-unit.result }}"
            "${{ needs.actionlint.result }}"
            "${{ needs.audit.result }}"
            "${{ needs.deny.result }}"
          )
          for r in "${results[@]}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "CI failed: at least one job reported $r"
              exit 1
            fi
          done
          echo "All jobs passed or were skipped"

  cancel-on-failure:
    name: cancel on failure
    runs-on: ubuntu-latest
    needs: [lint, test-unit]
    if: failure()
    steps:
      - name: cancel workflow run
        run: gh run cancel "$RUN_ID" --repo "$REPO"
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}

[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = "1"
dirs = "6"
hex = "0.4"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1.1"
chrono = { version = "0.4", features = ["serde"] }
xshell = "0.2"
miette = { workspace = true }
thiserror = { workspace = true }
minibox-testsuite = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[package.metadata.cargo-machete]
# miette/thiserror are staged for the musl prepush cross-check diagnostic
# (docs/designs/2026-07-17-musl-prepush-cross-check-design.md), not yet implemented.
ignored = ["miette", "thiserror"]
